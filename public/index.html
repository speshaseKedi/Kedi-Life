<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kedi Life 🐾</title>
<meta name="theme-color" content="#FDEBD2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDEBD2; --card:#FFF9EE; --ink:#4A342A; --ink-soft:#8A7362;
    --grass:#8FBF7F; --grass-deep:#6EA05F;
    --accent:#E86A33; --accent-deep:#C24F1E;
    --teal:#2E8B7A; --danger:#D65454; --gold:#F2B84B;
    --line:#EAD9BC;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif; font-weight:600;
    min-height:100dvh;
  }
  #app{max-width:440px; margin:0 auto; padding:14px 14px 26px;}
  header{display:flex; align-items:center; gap:10px; padding:4px 2px 12px;}
  header .logo-cat{width:40px; height:40px;}
  header h1{font-family:'Fredoka',sans-serif; font-weight:600; font-size:26px; margin:0; letter-spacing:.5px;}
  header p{margin:0; font-size:12.5px; color:var(--ink-soft);}
  h2{font-family:'Fredoka',sans-serif; font-weight:600; font-size:20px; margin:6px 0 12px;}
  .screen{display:none;}
  .screen.on{display:block;}
  .note{font-size:13px; color:var(--ink-soft); margin:10px 2px;}
  .btn{
    display:block; width:100%; border:none; cursor:pointer;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:18px;
    color:#fff; background:var(--accent);
    padding:14px 18px; border-radius:16px;
    box-shadow:0 4px 0 var(--accent-deep);
    transition:transform .08s ease, box-shadow .08s ease, opacity .2s;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--accent-deep);}
  .btn:disabled{opacity:.45; box-shadow:none; cursor:default;}
  .btn.ghost{background:var(--card); color:var(--ink); box-shadow:0 3px 0 var(--line); font-size:15px; padding:11px 14px;}
  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0 14px;}
  .cat-card{
    background:var(--card); border:2.5px solid var(--line); border-radius:18px;
    padding:12px 8px 10px; text-align:center; cursor:pointer;
    transition:transform .1s, border-color .15s;
  }
  .cat-card svg{width:64px; height:64px;}
  .cat-card .cname{font-family:'Fredoka',sans-serif; font-size:15px; margin-top:2px;}
  .cat-card.sel{border-color:var(--accent); transform:scale(1.03); background:#FFF3E2;}
  .cat-card.taken{opacity:.45; filter:grayscale(.7); pointer-events:none;}
  .cat-card .tag{font-size:11px; color:var(--danger); font-weight:800; height:13px;}
  input[type=text]{
    width:100%; font:inherit; font-size:16px; color:var(--ink);
    background:var(--card); border:2.5px solid var(--line); border-radius:14px;
    padding:12px 14px; margin:2px 0 12px; outline:none;
  }
  input[type=text]:focus{border-color:var(--teal);}
  .plist{display:flex; flex-direction:column; gap:8px; margin:6px 0 14px;}
  .prow{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:2px solid var(--line); border-radius:14px; padding:8px 12px;
  }
  .prow svg{width:34px; height:34px;}
  .prow .pn{font-size:15px; font-weight:800;}
  .pill{font-size:11px; font-weight:800; padding:2px 8px; border-radius:99px; background:#EFE3CC; color:var(--ink-soft);}
  .pill.me{background:var(--teal); color:#fff;}
  #chips{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:10px;}
  .chip{
    display:flex; align-items:center; gap:7px;
    background:var(--card); border:2px solid var(--line); border-radius:14px; padding:6px 9px;
    transition:border-color .2s, box-shadow .2s;
  }
  .chip svg{width:28px; height:28px; flex:none;}
  .chip .cn{font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:74px;}
  .chip .cs{margin-left:auto; font-size:13px; font-weight:800; color:var(--accent-deep); white-space:nowrap;}
  .chip .st{font-size:12px;}
  .chip.turn{border-color:var(--gold); box-shadow:0 0 0 3px #F2B84B55;}
  .chip.done{opacity:.75;}
  #board{
    position:relative; background:var(--grass);
    border:4px solid var(--grass-deep); border-radius:22px; padding:10px;
  }
  #tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .cell{
    position:relative; aspect-ratio:1/1; border-radius:13px;
    background:var(--card); border:2px solid #00000014;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-size:11px; font-weight:800; color:var(--ink-soft);
  }
  .cell .ic{font-size:19px; line-height:1;}
  .cell .num{position:absolute; top:3px; left:6px; font-size:9px; color:#00000033;}
  .cell.gain{background:#EAF6E0;}
  .cell.lose{background:#FBE3DE;}
  .cell.nap{background:#ECE7F8;}
  .cell.swap{background:#FBE7F1;}
  .cell.move{background:#E1F1F5;}
  .cell.chance{background:#FFF3CF;}
  .cell.start{background:var(--gold); color:#6B4A12;}
  .cell.home{background:#F7A868; color:#6E3A12;}
  .cell.start .lb,.cell.home .lb{font-family:'Fredoka',sans-serif; font-size:12px;}
  .token{
    position:absolute; z-index:5; left:0; top:0;
    transition:transform .24s cubic-bezier(.34,1.4,.5,1);
    pointer-events:none;
  }
  .token svg{width:100%; height:100%; filter:drop-shadow(0 2px 1px #00000022);}
  .token.turn .tin{animation:idle 1.1s ease-in-out infinite;}
  .tin{display:block; width:100%; height:100%;}
  .tin.hop{animation:hop .24s ease;}
  @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes hop{0%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-7px) scaleY(1.06)}100%{transform:translateY(0) scaleY(1)}}
  #dock{
    margin-top:12px; background:var(--card); border:2px solid var(--line);
    border-radius:18px; padding:12px; display:flex; align-items:center; gap:12px;
  }
  #dice{
    width:58px; height:58px; flex:none; border-radius:14px;
    background:#fff; border:2.5px solid var(--ink);
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    padding:8px; gap:2px;
  }
  #dice.shake{animation:shake .1s linear infinite;}
  @keyframes shake{0%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}100%{transform:rotate(-7deg)}}
  #dice .pip{border-radius:50%; background:transparent;}
  #dice .pip.on{background:var(--ink);}
  #dockmid{flex:1; min-width:0;}
  #status{font-family:'Fredoka',sans-serif; font-size:15.5px; line-height:1.25;}
  #lastev{font-size:11.5px; color:var(--ink-soft); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #rollbtn{width:auto; padding:13px 20px; font-size:17px; flex:none;}
  #eventOverlay{
    position:fixed; inset:0; z-index:40; display:none;
    align-items:center; justify-content:center; pointer-events:none;
  }
  #eventOverlay.on{display:flex;}
  #eventCard{
    background:var(--card); border:3px solid var(--ink); border-radius:22px;
    box-shadow:0 8px 0 #00000025;
    padding:18px 22px; max-width:300px; text-align:center;
    animation:pop .28s cubic-bezier(.34,1.5,.5,1);
  }
  #eventCard .eic{font-size:44px; line-height:1.1;}
  #eventCard .etx{font-family:'Fredoka',sans-serif; font-size:17px; margin-top:6px;}
  #eventCard .ewho{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  #eventCard .edl{display:inline-block; margin-top:8px; font-weight:800; font-size:15px; padding:3px 12px; border-radius:99px;}
  .edl.up{background:#DFF2D2; color:#2F6B1E;}
  .edl.down{background:#FBDCD6; color:#A33326;}
  @keyframes pop{0%{transform:scale(.6); opacity:0}100%{transform:scale(1); opacity:1}}
  .float{
    position:absolute; z-index:9; font-weight:800; font-size:15px;
    animation:rise 1.1s ease forwards; pointer-events:none;
    text-shadow:0 1px 0 #fff;
  }
  @keyframes rise{0%{opacity:0; transform:translateY(4px)}20%{opacity:1}100%{opacity:0; transform:translateY(-26px)}}
  #overOverlay{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; background:#4A342A66; padding:18px;
  }
  #overOverlay.on{display:flex;}
  #overCard{
    background:var(--card); border-radius:24px; padding:22px 20px;
    width:100%; max-width:360px; text-align:center;
    animation:pop .3s cubic-bezier(.34,1.5,.5,1);
  }
  #overCard h2{margin:2px 0 2px; font-size:23px;}
  #overCard .wsub{font-size:13px; color:var(--ink-soft); margin-bottom:12px;}
  .rrow{
    display:flex; align-items:center; gap:9px; text-align:left;
    background:#FBF2E0; border-radius:13px; padding:8px 12px; margin-bottom:7px;
  }
  .rrow.first{background:#FFF0C9; border:2px solid var(--gold);}
  .rrow .medal{font-size:19px;}
  .rrow svg{width:30px; height:30px;}
  .rrow .rn{font-size:14.5px; font-weight:800; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rrow .rs{font-weight:800; color:var(--accent-deep); white-space:nowrap;}
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:700;
    padding:10px 16px; border-radius:99px; z-index:60;
    opacity:0; transition:opacity .25s; pointer-events:none; max-width:86vw; text-align:center;
  }
  #toast.on{opacity:1;}
  .lobbytip{
    display:flex; gap:10px; align-items:flex-start;
    background:#E7F3EF; border:2px solid #BBDCD2; border-radius:14px;
    padding:10px 12px; font-size:13px; color:#22574C; margin-bottom:12px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo-cat" id="logoCat"></span>
    <div>
      <h1>Kedi Life</h1>
      <p>Roll the dice, collect snacks, get home! 🐾</p>
    </div>
  </header>

  <section class="screen" id="scr-join">
    <h2>Pick your Kedi!</h2>
    <div class="cat-grid" id="catGrid"></div>
    <input type="text" id="nameInput" maxlength="12" placeholder="Your Kedi's name (e.g. Mochi)">
    <button class="btn" id="joinBtn">Join the game</button>
    <p class="note" id="joinNote">2–4 players · playing alone? a bot Kedi joins you 🤖</p>
  </section>

  <section class="screen" id="scr-lobby">
    <h2>Waiting room</h2>
    <div class="lobbytip">
      <span>🔗</span>
      <span><b>Invite friends:</b> just share this page's link. They open it, pick a Kedi, and hop in!</span>
    </div>
    <div class="plist" id="lobbyList"></div>
    <button class="btn ghost" id="copyBtn" style="margin-bottom:10px;">Copy invite link</button>
    <button class="btn" id="startBtn">Start game</button>
    <p class="note">Everyone starts at 🏁 and races home 🏠. Most snacks wins!</p>
  </section>

  <section class="screen" id="scr-game">
    <div id="chips"></div>
    <div id="board">
      <div id="tiles"></div>
    </div>
    <div id="dock">
      <div id="dice"></div>
      <div id="dockmid">
        <div id="status">…</div>
        <div id="lastev"></div>
      </div>
      <button class="btn" id="rollbtn">Roll!</button>
    </div>
  </section>
</div>

<div id="eventOverlay"><div id="eventCard"></div></div>
<div id="overOverlay"><div id="overCard"></div></div>
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
"use strict";
var socket = io();
var BOARDC = null, S = null, YOU = -1;
var animating = false, pending = null;
var POS = [], SNACKS = [];
var selCat = null;
var tokenEls = {};
var uidc = 0;

var CAT_INFO = {
  tuxedo:{label:'Tuxedo'}, orange:{label:'Orange'}, white:{label:'White'}, calico:{label:'Calico'}
};

function catSVG(cat){
  uidc++;
  var id = 'cc' + uidc;
  var c = {
    tuxedo:{body:'#3B342C', line:'#241F19', earL:'#3B342C', earR:'#3B342C', eye:'#F5C542'},
    orange:{body:'#F0A03C', line:'#B96F1E', earL:'#F0A03C', earR:'#F0A03C', eye:'#4A342A'},
    white:{body:'#FFFDF6', line:'#C4B8A5', earL:'#FFFDF6', earR:'#FFFDF6', eye:'#5D95CB'},
    calico:{body:'#FFFDF6', line:'#C4B8A5', earL:'#F0A03C', earR:'#3B342C', eye:'#5FA86B'}
  }[cat];
  var patches = '';
  if (cat === 'calico'){
    patches = '<g clip-path="url(#'+id+')">' +
      '<circle cx="21" cy="26" r="10" fill="#F0A03C"/>' +
      '<circle cx="44" cy="25" r="8" fill="#3B342C"/></g>';
  }
  var stripes = '';
  if (cat === 'orange'){
    stripes = '<g clip-path="url(#'+id+')" stroke="#D3822A" stroke-width="3" stroke-linecap="round">' +
      '<path d="M26 16 L28 24" fill="none"/><path d="M32 15 L32 23" fill="none"/><path d="M38 16 L36 24" fill="none"/></g>';
  }
  var muzzle = (cat === 'tuxedo') ? '<ellipse cx="32" cy="43" rx="11" ry="8.5" fill="#FFFDF6"/>' : '';
  return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<defs><clipPath id="'+id+'"><circle cx="32" cy="37" r="21"/></clipPath></defs>' +
    '<polygon points="13,28 16,8 29,19" fill="'+c.earL+'" stroke="'+c.line+'" stroke-width="2.5" stroke-linejoin="round"/>' +
    '<polygon points="51,28 48,8 35,19" fill="'+c.earR+'" stroke="'+c.line+'" stroke-width="2.5" stroke-linejoin="round"/>' +
    '<polygon points="16.5,24 18,13 25,19" fill="#F2A9A0"/>' +
    '<polygon points="47.5,24 46,13 39,19" fill="#F2A9A0"/>' +
    '<circle cx="32" cy="37" r="21" fill="'+c.body+'" stroke="'+c.line+'" stroke-width="2.5"/>' +
    patches + stripes + muzzle +
    '<ellipse cx="24.5" cy="34" rx="3.2" ry="4" fill="'+c.eye+'"/>' +
    '<ellipse cx="39.5" cy="34" rx="3.2" ry="4" fill="'+c.eye+'"/>' +
    '<circle cx="25.5" cy="32.6" r="1.1" fill="#fff"/>' +
    '<circle cx="40.5" cy="32.6" r="1.1" fill="#fff"/>' +
    '<polygon points="32,40 29.6,42.4 34.4,42.4" fill="#E98A80"/>' +
    '<path d="M32 42.5 Q32 46 28.5 46.5 M32 42.5 Q32 46 35.5 46.5" fill="none" stroke="'+ (cat==='tuxedo'?'#241F19':c.line) +'" stroke-width="1.8" stroke-linecap="round"/>' +
    '<g stroke="'+ (cat==='tuxedo'?'#8A7362':c.line) +'" stroke-width="1.6" stroke-linecap="round">' +
    '<path d="M18 40 L8 38" fill="none"/><path d="M18 44 L9 45" fill="none"/>' +
    '<path d="M46 40 L56 38" fill="none"/><path d="M46 44 L55 45" fill="none"/></g>' +
    '</svg>';
}

document.getElementById('logoCat').innerHTML = catSVG('orange');

function $(id){ return document.getElementById(id); }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); }

function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}

function show(scr){
  ['scr-join','scr-lobby','scr-game'].forEach(function(s){
    $(s).classList.toggle('on', s === scr);
  });
}

function cellIndexFor(pathIdx){
  var row = Math.floor(pathIdx / 4);
  var col = pathIdx % 4;
  if (row % 2 === 1) col = 3 - col;
  return row * 4 + col;
}

function buildBoard(){
  var tiles = $('tiles');
  tiles.innerHTML = '';
  var cells = new Array(24);
  for (var p = 0; p < 24; p++){
    var t = BOARDC[p];
    var d = document.createElement('div');
    d.className = 'cell ' + t.t;
    var sub = '';
    if (t.t === 'gain') sub = '+' + t.v;
    else if (t.t === 'lose') sub = '-' + t.v;
    else if (t.t === 'nap') sub = 'nap';
    else if (t.t === 'swap') sub = 'swap';
    else if (t.t === 'move') sub = t.v > 0 ? '+' + t.v + ' ▸' : '◂ ' + (-t.v);
    else if (t.t === 'chance') sub = '?';
    var numHtml = (t.t === 'start' || t.t === 'home') ? '' : '<span class="num">' + p + '</span>';
    var main = (t.t === 'start' || t.t === 'home')
      ? '<span class="ic">' + t.icon + '</span><span class="lb">' + t.label + '</span>'
      : '<span class="ic">' + t.icon + '</span><span>' + sub + '</span>';
    d.innerHTML = numHtml + main;
    cells[cellIndexFor(p)] = d;
  }
  cells.forEach(function(c){ tiles.appendChild(c); });
  window._cells = cells;
}

function cellEl(pathIdx){ return window._cells[cellIndexFor(pathIdx)]; }

function ensureTokens(){
  var board = $('board');
  Object.keys(tokenEls).forEach(function(k){
    if (!S || +k >= S.players.length){ tokenEls[k].remove(); delete tokenEls[k]; }
  });
  if (!S) return;
  S.players.forEach(function(p, i){
    if (!tokenEls[i]){
      var el = document.createElement('div');
      el.className = 'token';
      el.innerHTML = '<span class="tin">' + catSVG(p.cat) + '</span>';
      board.appendChild(el);
      tokenEls[i] = el;
    }
  });
}

function placeTokens(hop){
  if (!S || !window._cells) return;
  var groups = {};
  POS.forEach(function(pos, i){ (groups[pos] = groups[pos] || []).push(i); });
  Object.keys(groups).forEach(function(pos){
    var idxs = groups[pos];
    var cell = cellEl(+pos);
    if (!cell) return;
    var cw = cell.offsetWidth;
    var size = Math.max(26, cw * 0.56);
    var cx = cell.offsetLeft + cw / 2;
    var cy = cell.offsetTop + cell.offsetHeight / 2;
    var offs = idxs.length === 1 ? [[0,0]] :
      idxs.length === 2 ? [[-0.22,0],[0.22,0]] :
      idxs.length === 3 ? [[-0.22,-0.2],[0.22,-0.2],[0,0.22]] :
      [[-0.22,-0.2],[0.22,-0.2],[-0.22,0.22],[0.22,0.22]];
    idxs.forEach(function(pi, k){
      var el = tokenEls[pi];
      if (!el) return;
      var s = idxs.length > 1 ? size * 0.8 : size;
      el.style.width = s + 'px';
      el.style.height = s + 'px';
      var x = cx + offs[k][0] * cw - s / 2;
      var y = cy + offs[k][1] * cw - s / 2 - 4;
      el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      el.classList.toggle('turn', S.phase === 'playing' && +S.turn === pi && !animating);
    });
  });
}

function hopToken(pi){
  var el = tokenEls[pi];
  if (!el) return;
  var tin = el.querySelector('.tin');
  tin.classList.remove('hop');
  void tin.offsetWidth;
  tin.classList.add('hop');
}

function diceFace(n){
  var map = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  var on = map[n] || [];
  var html = '';
  for (var i = 0; i < 9; i++) html += '<span class="pip' + (on.indexOf(i) >= 0 ? ' on' : '') + '"></span>';
  $('dice').innerHTML = html;
}

async function diceRollAnim(n){
  var d = $('dice');
  d.classList.add('shake');
  var t = 0;
  while (t < 750){
    diceFace(1 + Math.floor(Math.random() * 6));
    await wait(85);
    t += 85;
  }
  d.classList.remove('shake');
  diceFace(n);
  await wait(320);
}

function floatDelta(pi, delta){
  var el = tokenEls[pi];
  if (!el) return;
  var f = document.createElement('div');
  f.className = 'float';
  f.textContent = (delta > 0 ? '+' : '') + delta + ' 🍪';
  f.style.color = delta > 0 ? '#2F6B1E' : '#A33326';
  var m = /translate\(([-\d.]+)px,\s*([-\d.]+)px\)/.exec(el.style.transform);
  if (m){ f.style.left = (parseFloat(m[1])) + 'px'; f.style.top = (parseFloat(m[2]) - 12) + 'px'; }
  $('board').appendChild(f);
  setTimeout(function(){ f.remove(); }, 1150);
}

async function showEvents(events){
  var ov = $('eventOverlay'), card = $('eventCard');
  for (var i = 0; i < events.length; i++){
    var ev = events[i];
    var who = (ev.pIdx != null && S.players[ev.pIdx]) ? S.players[ev.pIdx].name : '';
    var dl = '';
    if (typeof ev.delta === 'number' && ev.delta !== 0){
      dl = '<div class="edl ' + (ev.delta > 0 ? 'up' : 'down') + '">' + (ev.delta > 0 ? '+' : '') + ev.delta + ' snacks 🍪</div>';
    }
    card.innerHTML = '<div class="eic">' + ev.icon + '</div>' +
      '<div class="etx">' + esc(ev.text) + '</div>' +
      (who ? '<div class="ewho">' + esc(who) + '</div>' : '') + dl;
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    ov.classList.add('on');
    if (typeof ev.delta === 'number' && ev.pIdx != null){
      SNACKS[ev.pIdx] = Math.max(0, SNACKS[ev.pIdx] + ev.delta);
      renderChips();
      floatDelta(ev.pIdx, ev.delta);
    }
    if (ev.swap){
      POS[ev.swap[0]] = ev.aPos;
      POS[ev.swap[1]] = ev.bPos;
      placeTokens(false);
      await wait(500);
    }
    $('lastev').textContent = ev.icon + ' ' + ev.text;
    await wait(1500);
  }
  ov.classList.remove('on');
}

async function animateTurn(pl){
  S = pl.state; YOU = pl.you;
  if (POS.length !== S.players.length){ syncLive(); }
  renderGameStatic(pl.playerIdx);
  var name = S.players[pl.playerIdx] ? S.players[pl.playerIdx].name : '';
  if (pl.skipped){
    $('status').textContent = '💤 ' + name + ' is napping...';
    await showEvents(pl.events);
    return;
  }
  $('status').textContent = '🎲 ' + name + ' rolled...';
  await diceRollAnim(pl.dice);
  $('status').textContent = '🎲 ' + name + ' rolled a ' + pl.dice + '!';
  for (var s = 0; s < pl.steps.length; s++){
    var st = pl.steps[s];
    var dir = st.to > st.from ? 1 : -1;
    for (var t = st.from + dir; ; t += dir){
      POS[st.pIdx] = t;
      placeTokens(true);
      hopToken(st.pIdx);
      await wait(265);
      if (t === st.to) break;
    }
  }
  await showEvents(pl.events);
}

function syncLive(){
  POS = S.players.map(function(p){ return p.pos; });
  SNACKS = S.players.map(function(p){ return p.snacks; });
}

function apply(payload){
  S = payload.state; YOU = payload.you;
  syncLive();
  render();
}

function render(){
  if (!S) return;
  $('overOverlay').classList.remove('on');
  if (S.phase === 'lobby'){
    if (YOU >= 0) renderLobby(); else renderJoin();
    return;
  }
  renderGameStatic(S.turn);
  renderDock();
  if (S.phase === 'over') renderOver();
}

function renderJoin(){
  show('scr-join');
  var g = $('catGrid');
  g.innerHTML = '';
  var full = S.players.length >= 4;
  Object.keys(CAT_INFO).forEach(function(key){
    var taken = S.players.some(function(p){ return p.cat === key; });
    var d = document.createElement('div');
    d.className = 'cat-card' + (taken ? ' taken' : '') + (selCat === key ? ' sel' : '');
    d.innerHTML = catSVG(key) + '<div class="cname">' + CAT_INFO[key].label + '</div>' +
      '<div class="tag">' + (taken ? 'Taken' : '') + '</div>';
    if (!taken){
      d.onclick = function(){ selCat = key; renderJoin(); };
    }
    g.appendChild(d);
  });
  $('joinBtn').disabled = full;
  $('joinNote').textContent = full
    ? 'The lobby is full (4 Kedi). Watch for the next round!'
    : '2–4 players · playing alone? a bot Kedi joins you 🤖';
}

function renderLobby(){
  show('scr-lobby');
  var list = $('lobbyList');
  list.innerHTML = '';
  S.players.forEach(function(p, i){
    var d = document.createElement('div');
    d.className = 'prow';
    d.innerHTML = catSVG(p.cat) + '<span class="pn">' + esc(p.name) + '</span>' +
      (i === YOU ? '<span class="pill me">you</span>' : '') +
      (p.isBot ? '<span class="pill">bot</span>' : '');
    list.appendChild(d);
  });
  for (var k = S.players.length; k < 4; k++){
    var e = document.createElement('div');
    e.className = 'prow';
    e.style.opacity = '.5';
    e.innerHTML = '<span style="width:34px;text-align:center;font-size:20px;">💭</span><span class="pn" style="color:var(--ink-soft)">Waiting for a friend...</span>';
    list.appendChild(e);
  }
  $('startBtn').textContent = S.players.length === 1 ? 'Start with a bot friend 🤖' : 'Start game (' + S.players.length + ' Kedi)';
}

function renderGameStatic(turnIdx){
  show('scr-game');
  if (!window._cells) buildBoard();
  ensureTokens();
  renderChips(turnIdx);
  placeTokens(false);
}

function renderChips(turnIdx){
  var ti = (turnIdx == null) ? S.turn : turnIdx;
  var c = $('chips');
  c.innerHTML = '';
  S.players.forEach(function(p, i){
    var d = document.createElement('div');
    d.className = 'chip' + (S.phase === 'playing' && i === ti ? ' turn' : '') + (p.finished ? ' done' : '');
    var st = p.finished ? '🏠' : (p.skip > 0 ? '💤' : '');
    var bot = p.isBot ? ' 🤖' : (!p.connected ? ' 📴' : '');
    d.innerHTML = catSVG(p.cat) +
      '<span class="cn">' + esc(p.name) + (i === YOU ? ' (you)' : '') + bot + '</span>' +
      '<span class="st">' + st + '</span>' +
      '<span class="cs">🍪 ' + (SNACKS[i] != null ? SNACKS[i] : p.snacks) + '</span>';
    c.appendChild(d);
  });
}

function renderDock(){
  var meIn = YOU >= 0;
  var rb = $('rollbtn');
  if (!meIn){
    $('status').textContent = "👀 You're watching this round — join the next one!";
    rb.style.display = 'none';
    return;
  }
  rb.style.display = '';
  var me = S.players[YOU];
  var turnP = S.players[S.turn];
  if (S.phase === 'over'){
    $('status').textContent = '🎉 Game over!';
    rb.disabled = true;
    return;
  }
  if (me.finished){
    $('status').textContent = "🏠 You're home! Waiting for the others...";
    rb.disabled = true;
  } else if (S.turn === YOU){
    $('status').textContent = '✨ Your turn — roll the dice!';
    rb.disabled = false;
  } else {
    $('status').textContent = '⏳ Waiting for ' + turnP.name + (turnP.isBot ? ' 🤖' : '') + '...';
    rb.disabled = true;
  }
}

function renderOver(){
  var ov = $('overOverlay'), card = $('overCard');
  var medals = ['🥇','🥈','🥉','4️⃣'];
  var winner = S.players[S.ranking[0]];
  var rows = S.ranking.map(function(pi, r){
    var p = S.players[pi];
    return '<div class="rrow' + (r === 0 ? ' first' : '') + '">' +
      '<span class="medal">' + medals[r] + '</span>' + catSVG(p.cat) +
      '<span class="rn">' + esc(p.name) + (pi === YOU ? ' (you)' : '') + (p.isBot ? ' 🤖' : '') + '</span>' +
      '<span class="rs">🍪 ' + p.snacks + '</span></div>';
  }).join('');
  card.innerHTML = '<div style="font-size:42px;">🏆</div>' +
    '<h2>' + esc(winner.name) + ' wins!</h2>' +
    '<div class="wsub">The snack champion of the neighborhood 🍪</div>' +
    rows +
    '<button class="btn" id="againBtn" style="margin-top:8px;">Play again</button>';
  ov.classList.add('on');
  $('againBtn').onclick = function(){ socket.emit('again'); };
}

$('joinBtn').onclick = function(){
  if (!selCat) return toast('Pick a Kedi first! 🐱');
  var name = $('nameInput').value.trim();
  if (!name) return toast('Give your Kedi a name!');
  socket.emit('join', { name: name, cat: selCat });
};
$('startBtn').onclick = function(){ socket.emit('start'); };
$('rollbtn').onclick = function(){
  $('rollbtn').disabled = true;
  socket.emit('roll');
};
$('copyBtn').onclick = function(){
  var url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ toast('Link copied! Send it to your friends 💌'); });
  } else {
    toast(url);
  }
};

socket.on('connect', function(){
  socket.emit('hello', { pid: localStorage.getItem('catlife_pid') });
});
socket.on('joined', function(d){
  localStorage.setItem('catlife_pid', d.pid);
});
socket.on('errmsg', toast);
socket.on('board', function(b){
  BOARDC = b;
  window._cells = null;
});
socket.on('state', function(payload){
  if (animating){ pending = payload; return; }
  apply(payload);
});
socket.on('turn', function(payload){
  (async function(){
    animating = true;
    try { await animateTurn(payload); } catch(e){ console.error(e); }
    animating = false;
    apply(pending || payload);
    pending = null;
  })();
});

window.addEventListener('resize', function(){ placeTokens(false); });
diceFace(6);
</script>
</body>
</html>
